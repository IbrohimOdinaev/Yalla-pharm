name: Deploy Prod

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, foodadmin, deploy]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_DIR: /home/foodadmin/yalla_projects/yalla-pharm-new
      TAG: latest
      IMAGE_OWNER: yalla-co
    steps:
      - name: Sync compose files
        run: |
          set -e
          cd "$DEPLOY_DIR"
          git fetch origin master
          git checkout ${{ github.event.workflow_run.head_sha }}

      - name: Ensure docker network
        run: |
          docker network inspect yalla-net-prod >/dev/null 2>&1 \
            || docker network create yalla-net-prod

      - name: Pull images
        run: |
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull

      - name: Apply stack
        run: |
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

      - name: Cleanup dangling images
        run: docker image prune -f
