name: Deploy Dev

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, foodadmin, deploy]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      DEPLOY_DIR: /home/foodadmin/yalla_projects/yalla-pharm-new
      TAG: develop
      IMAGE_OWNER: yalla-co
    steps:
      - name: Sync compose files
        run: |
          set -e
          cd "$DEPLOY_DIR"
          git fetch origin develop
          git checkout ${{ github.event.workflow_run.head_sha }}

      - name: Ensure docker network
        run: |
          docker network inspect yalla-net-dev >/dev/null 2>&1 \
            || docker network create yalla-net-dev

      - name: Pull images
        run: |
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev pull

      - name: Apply stack
        run: |
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d --remove-orphans

      - name: Cleanup dangling images
        run: docker image prune -f
