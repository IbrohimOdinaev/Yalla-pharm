name: Publish Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example pharm-api-v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      dockerfile: ${{ steps.meta.outputs.dockerfile }}
      context: ${{ steps.meta.outputs.context }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TAG" in
            pharm-api-v*)
              IMAGE_NAME="pharm-api"
              DOCKERFILE="yalla-back/Dockerfile"
              CONTEXT="yalla-back"
              VERSION="${TAG#pharm-api-v}"
              ;;
            pharm-front-v*)
              IMAGE_NAME="pharm-front"
              DOCKERFILE="yalla-farm-front/Dockerfile"
              CONTEXT="yalla-farm-front"
              VERSION="${TAG#pharm-front-v}"
              ;;
            *)
              echo "Unsupported tag: $TAG"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-pull BuildKit image with retry
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          docker pull moby/buildkit:buildx-stable-1

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pharm ${{ needs.prepare.outputs.image_name }} ${{ needs.prepare.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ needs.prepare.outputs.context }}
          file: ${{ needs.prepare.outputs.dockerfile }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
