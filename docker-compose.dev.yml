# ============================================
# STAGING override — explicit. Pass with `-f` to skip the auto-merged
# docker-compose.override.yml (the local stack).
#
# Logically identical to prod.yml — only the image tag (:develop), the
# network suffix (-dev), the container_name suffix (-dev) and the
# environment marker differ. Secrets here use defaults (`${VAR:-...}`),
# unlike prod where they're guarded by `${VAR:?msg}` and required.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     --env-file .env.dev up -d
#
# Pre-req (one-off on the staging VPS):
#   docker network create yalla-net-dev
#   docker login ghcr.io -u <user> --password-stdin   # PAT with read:packages
# ============================================

name: lunch-pharm-dev

services:

  front:
    image: ghcr.io/${IMAGE_OWNER:-yalla-co}/pharm-front:${TAG:-develop}
    container_name: pharm-front-dev
    restart: unless-stopped
    # Front is a Next.js renderer. Only public/runtime-safe variables
    # belong here; DB/JWT/MinIO/SMS/Telegram secrets stay on the api.
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_SIGNALR_ENABLED: ${NEXT_PUBLIC_SIGNALR_ENABLED:-false}
      NEXT_PUBLIC_SIGNALR_UPDATES_HUB_URL: ${NEXT_PUBLIC_SIGNALR_UPDATES_HUB_URL:-/hubs/updates}
      NEXT_PUBLIC_SIGNALR_TELEGRAM_AUTH_HUB_URL: ${NEXT_PUBLIC_SIGNALR_TELEGRAM_AUTH_HUB_URL:-/hubs/telegram-auth}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      MAHAL_API_TOKEN: ${MAHAL_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ONE_C_EXCHANGE_DIR: /data/1c-exchange
    volumes:
      - one-c-exchange-dev:/data/1c-exchange
    expose:
      - "3000"

  api:
    image: ghcr.io/${IMAGE_OWNER:-yalla-co}/pharm-api:${TAG:-develop}
    container_name: pharm-api-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      # Dev-friendly fallbacks so the stand still boots even when .env
      # is incomplete — never use these values for anything real.
      Jwt__Key: ${JWT_KEY:-staging-jwt-key-not-for-production-32chars!}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Host=postgres-staging;Username=postgres;Password=staging}
      Elasticsearch__Url: ${ELASTICSEARCH_URL:-http://opensearch:9200}
      Elasticsearch__MedicineIndex: ${ELASTICSEARCH_INDEX:-medicines}
      SmsVerification__WebOtpOrigin: ${SMS_VERIFICATION_WEB_OTP_ORIGIN:-dev-pharm.yalla.tj}
      TelegramStaffNotifications__BotToken: ${TELEGRAM_STAFF_NOTIFICATIONS_BOT_TOKEN:-}
      TelegramStaffNotifications__BotUsername: ${TELEGRAM_STAFF_NOTIFICATIONS_BOT_USERNAME:-yalla_pharm_dev_staff_notify_bot}
      TelegramStaffNotifications__PublicBaseUrl: ${TELEGRAM_STAFF_NOTIFICATIONS_PUBLIC_BASE_URL:-https://dev-pharm.yalla.tj}
      TelegramStaffNotifications__WebhookSecretToken: ${TELEGRAM_STAFF_NOTIFICATIONS_WEBHOOK_SECRET:-}
      TelegramStaffNotifications__AutoRegisterWebhookOnStart: "true"
      TelegramSuperAdminNotifications__BotToken: ${TELEGRAM_SUPERADMIN_NOTIFICATIONS_BOT_TOKEN:-}
      TelegramSuperAdminNotifications__BotUsername: ${TELEGRAM_SUPERADMIN_NOTIFICATIONS_BOT_USERNAME:-yalla_pharm_superadmin_bot}
      TelegramSuperAdminNotifications__PublicBaseUrl: ${TELEGRAM_SUPERADMIN_NOTIFICATIONS_PUBLIC_BASE_URL:-https://dev-pharm.yalla.tj}
      TelegramSuperAdminNotifications__WebhookSecretToken: ${TELEGRAM_SUPERADMIN_NOTIFICATIONS_WEBHOOK_SECRET:-}
      TelegramSuperAdminNotifications__AutoRegisterWebhookOnStart: "true"
    volumes:
      - one-c-exchange-dev:/data/1c-exchange:ro
    expose:
      - "8080"

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: yalla-opensearch-dev
    restart: unless-stopped
    environment:
      - cluster.name=yalla-search-dev
      - node.name=os-dev-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "9200"
    volumes:
      - opensearch-dev-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - yalla-net

# Same external network pattern as base, but a unique name so this
# stack can co-exist with the prod stack on the same host without
# accidentally sharing the database or any other service. Set up once:
#   docker network create yalla-net-dev
networks:
  yalla-net:
    external: true
    name: yalla-net-dev

volumes:
  opensearch-dev-data:
  one-c-exchange-dev:
