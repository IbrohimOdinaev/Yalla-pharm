# ============================================
# PRODUCTION override — explicit. Pass with `-f` to skip the auto-merged
# docker-compose.override.yml (the local stack).
#
# Same shape as docker-compose.dev.yml, but stricter:
#   - image tag :latest (or pin to a specific :master-<sha> for rollback)
#   - secrets MUST be set in .env.prod — compose fails-fast at parse time
#     thanks to `${VAR:?message}` guards, instead of starting the
#     container with an empty value and failing 30 seconds later
#   - container_name suffix -prod, network yalla-net-prod
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Pre-req (one-off on the production VPS):
#   docker network create yalla-net-prod
#   docker login ghcr.io -u <user> --password-stdin   # PAT with read:packages
# ============================================

name: lunch-pharm-prod

services:

  front:
    image: ghcr.io/${IMAGE_OWNER:-yalla-co}/pharm-front:${TAG:-latest}
    container_name: pharm-front-prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_SIGNALR_UPDATES_HUB_URL: ${NEXT_PUBLIC_SIGNALR_UPDATES_HUB_URL:-/hubs/updates}
      NEXT_PUBLIC_SIGNALR_TELEGRAM_AUTH_HUB_URL: ${NEXT_PUBLIC_SIGNALR_TELEGRAM_AUTH_HUB_URL:-/hubs/telegram-auth}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      MAHAL_API_TOKEN: ${MAHAL_API_TOKEN:?MAHAL_API_TOKEN is required for production}
      ONE_C_EXCHANGE_DIR: /data/1c-exchange
    expose:
      - "3000"
    volumes:
      - one-c-exchange-prod:/data/1c-exchange

  api:
    image: ghcr.io/${IMAGE_OWNER:-yalla-co}/pharm-api:${TAG:-latest}
    container_name: pharm-api-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Required-or-die. Compose refuses to start if any of these is
      # empty or unset, with a human-readable message right at parse
      # time. Catches the "deployed prod with a stale .env that's
      # missing the new var I added in the latest release" footgun
      # before the container ever boots.
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required for production}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING is required for production}
      MinIo__Endpoint: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required for production}
      MinIo__AccessKey: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MinIo__SecretKey: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MinIo__BucketName: ${MINIO_BUCKET:?MINIO_BUCKET is required for production}
      OneCImport__Enabled: "false"
      SmsVerification__WebOtpOrigin: ${SMS_VERIFICATION_WEB_OTP_ORIGIN:-pharm.yalla.tj}
      Telegram__WebhookPublicBaseUrl: ${TELEGRAM_WEBHOOK_PUBLIC_BASE_URL:-https://pharm.yalla.tj}
      Telegram__AutoRegisterWebhookOnStart: ${TELEGRAM_AUTO_REGISTER_WEBHOOK_ON_START:-true}
    volumes:
      - one-c-exchange-prod:/data/1c-exchange:ro
    expose:
      - "8080"

  one-c-worker:
    image: ghcr.io/${IMAGE_OWNER:-yalla-co}/pharm-api:${TAG:-latest}
    container_name: pharm-one-c-worker-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Yalla__RunMode: OneCWorker
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required for production}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING is required for production}
      MinIo__Endpoint: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required for production}
      MinIo__AccessKey: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required for production}
      MinIo__SecretKey: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required for production}
      MinIo__BucketName: ${MINIO_BUCKET:?MINIO_BUCKET is required for production}
      OneCImport__Enabled: "true"
      OneCImport__ExchangeDirectory: /data/1c-exchange
      OneCImport__PollIntervalSeconds: ${ONE_C_IMPORT_POLL_INTERVAL_SECONDS:-30}
      OneCImport__StableFileSeconds: ${ONE_C_IMPORT_STABLE_FILE_SECONDS:-30}
      OneCImport__DefaultSourceToken: ${ONE_C_IMPORT_DEFAULT_SOURCE_TOKEN:-}
      OneCImport__DefaultSourceName: ${ONE_C_IMPORT_DEFAULT_SOURCE_NAME:-1C}
      OneCImport__DefaultPharmacyId: ${ONE_C_IMPORT_DEFAULT_PHARMACY_ID:-00000000-0000-0000-0000-000000000000}
      SmsVerification__WebOtpOrigin: ${SMS_VERIFICATION_WEB_OTP_ORIGIN:-pharm.yalla.tj}
    volumes:
      - one-c-exchange-prod:/data/1c-exchange
    networks:
      - yalla-net

# Production network. Distinct name from staging guarantees the stacks
# never see each other, even if they end up on the same physical host.
networks:
  yalla-net:
    external: true
    name: yalla-net-prod

volumes:
  one-c-exchange-prod:
